# monitor config 
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:144,x:0,y:0,scale:1,vrr:1
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:144,x:1920,y:0,scale:1,vrr:1

# env variables
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,qt6ct
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,12
env=XDG_MENU_PREFIX,arch-
env=ELECTRON_OZONE_PLATFORM_HINT,wayland

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=0
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=0
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=12
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=50
repeat_delay=250
numlock_on=0
xkb_rules_layout=us,tr
xkb_rules_options=grp:ctrl_space_toggle,caps:escape

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.2
trackpad_accel_profile=1
trackpad_accel_speed=0.5
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=1
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0

# Appearance
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=0
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# set layout
bind=SUPER+SHIFT,t,setlayout,tile
bind=SUPER+SHIFT,d,setlayout,dwindle
bind=SUPER+SHIFT,s,setlayout,scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config / exit
bind=SUPER,r,reload_config
bind=SUPER,m,quit

# apps
bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,dolphin
bind=SUPER,space,spawn,rofi -show
bind=SUPER,c,spawn_shell,cliphist list | rofi -dmenu -p 'Clipboard' -display-columns 2 | cliphist decode | wl-copy
bind=SUPER+SHIFT,space,spawn,/home/yigiterensoy/.local/scripts/theme-rofi

# close window
bind=SUPER,q,killclient,
bind=SUPER,BackSpace,killclient,

# window state
bind=SUPER,v,togglefloating,
bind=SUPER,w,togglefullscreen,
bind=SUPER+SHIFT,F,togglemaximizescreen,
bind=SUPER,s,toggle_scratchpad
bind=SUPER,n,switch_layout

# focus 
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER,left,focusdir,left
bind=SUPER,down,focusdir,down
bind=SUPER,up,focusdir,up
bind=SUPER,right,focusdir,right

# swap window 
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,L,exchange_client,right

bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,down,exchange_client,down
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,right,exchange_client,right

# resize window 
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,l,resizewin,+50,+0

bind=SUPER+CTRL,left,resizewin,-50,+0
bind=SUPER+CTRL,down,resizewin,+0,+50
bind=SUPER+CTRL,up,resizewin,+0,-50
bind=SUPER+CTRL,right,resizewin,+50,+0

# monitors
bind=SUPER+ALT,h,focusmon,left
bind=SUPER+ALT,l,focusmon,right
bind=SUPER+ALT,left,focusmon,left
bind=SUPER+ALT,right,focusmon,right
bind=SUPER,x,tagmon,right

# tags (mango supports at most 9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# move client to tag and follow it 
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# previous/next tag 
bind=ALT,h,viewtoleft_have_client,0
bind=ALT,l,viewtoright_have_client,0
bind=ALT,left,viewtoleft_have_client,0
bind=ALT,right,viewtoright_have_client,0
bind=ALT+SHIFT,H,tagtoleft,0
bind=ALT+SHIFT,L,tagtoright,0
bind=ALT+SHIFT,left,tagtoleft,0
bind=ALT+SHIFT,right,tagtoright,0

# window status
bind=ALT,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,F,togglefakefullscreen,
bind=ALT,i,minimized,
bind=ALT+SHIFT,I,restore_minimized
bind=ALT,o,toggleoverlay,
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,r,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT+CTRL,h,scroller_stack,left
bind=ALT+CTRL,j,scroller_stack,down
bind=ALT+CTRL,k,scroller_stack,up
bind=ALT+CTRL,l,scroller_stack,right

bind=ALT+CTRL,left,scroller_stack,left
bind=ALT+CTRL,down,scroller_stack,down
bind=ALT+CTRL,up,scroller_stack,up
bind=ALT+CTRL,right,scroller_stack,right


# dwindle layout 
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# move floating windo
# bind=CTRL+SHIFT,h,movewin,-50,+0
# bind=CTRL+SHIFT,j,movewin,+0,+50
# bind=CTRL+SHIFT,k,movewin,+0,-50
# bind=CTRL+SHIFT,l,movewin,+50,+0

# bind=CTRL+SHIFT,left,movewin,-50,+0
# bind=CTRL+SHIFT,down,movewin,+0,+50
# bind=CTRL+SHIFT,up,movewin,+0,-50
# bind=CTRL+SHIFT,right,movewin,+50,+0

# media keys
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl s 10%+
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl s 10%-
bind=NONE,XF86AudioNext,spawn_shell,playerctl next
bind=NONE,XF86AudioPause,spawn_shell,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn_shell,playerctl previous

# screenshots / lock
bind=NONE,Print,spawn_shell,f=$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png; grim "$f" && wl-copy --type image/png < "$f"
bind=SHIFT,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && f=$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png && grim -g "$g" "$f" && wl-copy --type image/png < "$f"
bind=ALT,f4,spawn,hyprlock

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# autostart
exec_once=waybar -c /home/yigiterensoy/.config/waybar/mango.jsonc
exec_once=waypaper --restore
exec_once=lxqt-policykit-agent
exec_once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec_once=wl-paste --type text --watch cliphist store &
exec_once=hypridle

# gestures: gesturebind=mod,direction,fingers,function
gesturebind=none,left,3,viewtoright,0
gesturebind=none,right,3,viewtoleft,0

# window rules 
window_rule=is_floating:1,app_id:^xdg-desktop-portal-gtk$
window_rule=is_floating:1,app_id:^Matplotlib$
window_rule=is_floating:1,app_id:^waypaper$
window_rule=is_floating:1,app_id:^org\.pulseaudio\.pavucontrol$
window_rule=is_floating:1,app_id:^lxqt-policykit-agent$
window_rule=is_fullscreen:1,app_id:^gamescope$
window_rule=is_fullscreen:1,app_id:^steam_app_[0-9]+$
